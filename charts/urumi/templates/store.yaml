apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "urumi.name" . }}-wordpress
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { urumi/component: wordpress, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { urumi/component: wordpress, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: wordpress
          image: {{ .Values.images.store | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - { name: WORDPRESS_DB_HOST, value: {{ include "urumi.name" . }}-mariadb }
            - { name: WORDPRESS_DB_NAME, value: wordpress }
            - { name: WORDPRESS_DB_USER, value: wordpress }
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: wordpress-db-password } }
            - { name: STORE_PUBLIC_URL, value: {{ .Values.store.publicUrl | quote }} }
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', getenv('STORE_PUBLIC_URL'));
                define('WP_SITEURL', getenv('STORE_PUBLIC_URL'));
                define('DISALLOW_FILE_EDIT', true);
                define('WP_MEMORY_LIMIT', '256M');
          ports: [{ containerPort: 80, name: http }]
          startupProbe: { tcpSocket: { port: http }, periodSeconds: 2, failureThreshold: 90 }
          readinessProbe: { httpGet: { path: /urumi-health.php, port: http }, periodSeconds: 5, timeoutSeconds: 5, failureThreshold: 3 }
          livenessProbe: { tcpSocket: { port: http }, periodSeconds: 10, failureThreshold: 6 }
          resources: {{ toYaml .Values.store.resources | nindent 12 }}
          volumeMounts:
            - { name: wordpress, mountPath: /var/www/html }
            - { name: health, mountPath: /var/www/html/urumi-health.php, subPath: health.php, readOnly: true }
      volumes:
        - name: wordpress
          persistentVolumeClaim: { claimName: {{ include "urumi.name" . }}-wordpress }
        - name: health
          configMap: { name: {{ include "urumi.name" . }}-health }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "urumi.name" . }}-wordpress
spec:
  selector: { urumi/component: wordpress, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ port: 80, targetPort: http }]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "urumi.name" . }}-store-bootstrap-{{ .Release.Revision }}
  labels: { urumi/component: store-bootstrap, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: { urumi/component: store-bootstrap, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: { runAsUser: 33, runAsGroup: 33, fsGroup: 33 }
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { urumi/component: wordpress, app.kubernetes.io/instance: {{ .Release.Name }} }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: bootstrap
          image: {{ .Values.images.store | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: [bash, /opt/urumi/bootstrap.sh]
          env:
            - { name: WORDPRESS_DB_HOST, value: {{ include "urumi.name" . }}-mariadb }
            - { name: WORDPRESS_DB_NAME, value: wordpress }
            - { name: WORDPRESS_DB_USER, value: wordpress }
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: wordpress-db-password } }
            - { name: STORE_PUBLIC_URL, value: {{ .Values.store.publicUrl | quote }} }
            - { name: STORE_TIMEZONE, value: {{ .Values.store.timezone | quote }} }
            - { name: WOOCOMMERCE_VERSION, value: {{ .Values.store.woocommerceVersion | quote }} }
            - { name: WORDPRESS_ADMIN_USER, value: admin }
            - name: WORDPRESS_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: wordpress-admin-password } }
            - name: WOO_CONSUMER_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: woo-consumer-key } }
            - name: WOO_CONSUMER_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: woo-consumer-secret } }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: wordpress, mountPath: /var/www/html }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: wordpress
          persistentVolumeClaim: { claimName: {{ include "urumi.name" . }}-wordpress }
        - name: tmp
          emptyDir: {}
