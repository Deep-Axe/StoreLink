apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "urumi.name" . }}-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "urumi.name" . }}-credentials
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.upstreamSecretName | quote }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "urumi.name" . }}-credentials
subjects:
  - kind: ServiceAccount
    name: {{ include "urumi.name" . }}-gateway
roleRef:
  kind: Role
  name: {{ include "urumi.name" . }}-credentials
  apiGroup: rbac.authorization.k8s.io
