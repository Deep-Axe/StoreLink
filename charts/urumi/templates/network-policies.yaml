{{- if .Values.networkPolicies.enabled }}
{{- range $destination, $sources := dict "time-mcp" (list "gateway") "operations-mcp" (list "gateway") "woo-mcp" (list "gateway") "postgres" (list "gateway") "mariadb" (list "wordpress" "store-bootstrap") "wordpress" (list "woo-mcp") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "urumi.name" $ }}-{{ $destination }}
spec:
  podSelector:
    matchLabels: { urumi/component: {{ $destination }}, app.kubernetes.io/instance: {{ $.Release.Name }} }
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $source := $sources }}
        - podSelector:
            matchLabels: { urumi/component: {{ $source }}, app.kubernetes.io/instance: {{ $.Release.Name }} }
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ index (dict "time-mcp" 3002 "operations-mcp" 3003 "woo-mcp" 3001 "postgres" 5432 "mariadb" 3306 "wordpress" 80) $destination }}
    {{- if eq $destination "wordpress" }}
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
      ports: [{ protocol: TCP, port: 80 }]
    {{- end }}
{{- end }}
{{- end }}
