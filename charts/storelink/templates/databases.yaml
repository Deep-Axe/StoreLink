apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "storelink.name" . }}-postgres
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { storelink/component: postgres, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { storelink/component: postgres, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.images.postgres | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - { name: POSTGRES_USER, value: storelink }
            - { name: POSTGRES_DB, value: storelink }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: postgres-password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432, name: postgres }]
          startupProbe: { exec: { command: [pg_isready, -U, storelink] }, periodSeconds: 2, failureThreshold: 60 }
          readinessProbe: { exec: { command: [pg_isready, -U, storelink] }, periodSeconds: 5 }
          livenessProbe: { exec: { command: [pg_isready, -U, storelink] }, periodSeconds: 10, failureThreshold: 6 }
          resources: {{ toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ include "storelink.name" . }}-postgres }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "storelink.name" . }}-postgres
spec:
  selector: { storelink/component: postgres, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "storelink.name" . }}-mariadb
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { storelink/component: mariadb, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { storelink/component: mariadb, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mariadb
          image: {{ .Values.images.mariadb | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: [--innodb-buffer-pool-size=64M, --max-connections=30]
          env:
            - { name: MARIADB_DATABASE, value: wordpress }
            - { name: MARIADB_USER, value: wordpress }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: wordpress-db-password } }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: mariadb-root-password } }
          ports: [{ containerPort: 3306, name: mysql }]
          startupProbe: { exec: { command: [healthcheck.sh, --connect, --innodb_initialized] }, periodSeconds: 2, failureThreshold: 60 }
          readinessProbe: { exec: { command: [healthcheck.sh, --connect, --innodb_initialized] }, periodSeconds: 5 }
          livenessProbe: { exec: { command: [healthcheck.sh, --connect] }, periodSeconds: 10, failureThreshold: 6 }
          resources: {{ toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ include "storelink.name" . }}-mariadb }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "storelink.name" . }}-mariadb
spec:
  selector: { storelink/component: mariadb, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ port: 3306, targetPort: mysql }]
