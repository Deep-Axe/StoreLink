{{- range $component, $config := dict "wordpress" .Values.store "gateway" .Values.gateway }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "storelink.name" $ }}-{{ $component }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  {{- if $.Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ $config.host | quote }}]
      secretName: {{ $.Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $config.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "storelink.name" $ }}-{{ $component }}
                port:
                  number: {{ ternary 3000 80 (eq $component "gateway") }}
{{- end }}
