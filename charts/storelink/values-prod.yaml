# Replace registry/domain values and supply storelink-credentials and storelink-tls.
teamId: production
images:
  app: registry.example.com/storelink/app:0.1.0
  store: registry.example.com/storelink/wordpress:0.1.0
store:
  host: store.example.com
  publicUrl: https://store.example.com
gateway:
  host: dashboard.example.com
  publicUrl: https://dashboard.example.com
storage:
  className: local-path
  wordpress: 10Gi
  mariadb: 5Gi
  postgres: 5Gi
ingress:
  tls:
    enabled: true
    secretName: storelink-tls
