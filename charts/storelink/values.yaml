fullnameOverride: storelink
secretName: storelink-credentials
teamId: development
upstreamSecretName: storelink-upstream-credentials
chat:
  enabled: false
  model: gpt-6-luna
  limits:
    perUserHour: 15
    perUserConcurrent: 1
    perTeamConcurrent: 4
    globalConcurrent: 16
images:
  app: storelink-app:0.1.0-dev
  store: storelink-wordpress:0.1.0-dev
  postgres: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
  mariadb: mariadb:11.8@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
  pullPolicy: IfNotPresent
store:
  host: store.storelink.localhost
  publicUrl: http://store.storelink.localhost
  timezone: Asia/Kolkata
  woocommerceVersion: '11.2.1'
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: '2', memory: 768Mi }
gateway:
  extraUpstreamOrigins: []
  healthIntervalMs: 1000
  metrics:
    enabled: true
    port: 9464
  host: dashboard.storelink.localhost
  publicUrl: http://dashboard.storelink.localhost
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: '1', memory: 256Mi }
wooMcp:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: '1', memory: 192Mi }
additionalMcp:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: '1', memory: 128Mi }
postgres:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: '1', memory: 256Mi }
mariadb:
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: '1', memory: 384Mi }
storage:
  className: local-path
  wordpress: 2Gi
  mariadb: 1Gi
  postgres: 1Gi
ingress:
  className: traefik
  tls:
    enabled: false
    secretName: storelink-tls
networkPolicies:
  # Ingress isolation for the MCP servers, databases and WordPress.
  enabled: true
  # Deny all other traffic in the namespace, in and out, and allow each path explicitly.
  # Set to false while developing to leave non-isolated traffic open.
  defaultDeny: true
  # Where the gateway reaches the Kubernetes API, as the API server's own address and
  # port (6443 on k3s; often 443 on managed clusters). Narrow the CIDR where it is known.
  kubernetesApi:
    cidrs: [0.0.0.0/0]
    ports: [6443]
  # Gateway egress to public HTTPS (OpenAI and public upstreams).
  publicHttps: true
  # Peers allowed to scrape the gateway metrics port, as NetworkPolicy `from` entries.
  metricsFrom: []
  # Extra egress rules for the gateway, for example private HTTP upstreams.
  gatewayEgress: []
  # Extra egress rules for WordPress, for example plugin updates or WP-Cron over the public URL.
  wordpressEgress: []
