name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:dashboard
      - run: npm run format:check
      - name: Check Helm chart
        shell: bash
        run: |
          curl -fsSLO https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v4.3.1-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v4.3.1-linux-amd64.tar.gz
          linux-amd64/helm lint charts/urumi -f charts/urumi/values-local.yaml
          linux-amd64/helm lint charts/urumi -f charts/urumi/values-prod.yaml
          linux-amd64/helm template urumi charts/urumi -f charts/urumi/values-prod.yaml > /dev/null
